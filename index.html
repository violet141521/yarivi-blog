<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ═══ SEO: Title & Description ═══ -->
    <title>Yarivi — Notícias de Tecnologia em PT-BR | Sem jargão</title>
    <meta name="description" content="As principais notícias de IA, hardware, cibersegurança e software explicadas em português — sem jargão, sem clickbait. Lido por +48.000 pessoas toda semana.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://yarivi.com/">

    <!-- ═══ Open Graph (WhatsApp, LinkedIn, Facebook) ═══ -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Yarivi">
    <meta property="og:title" content="Yarivi — Tecnologia sem ruído, informação com propósito">
    <meta property="og:description" content="As 5 principais notícias de tech toda semana, explicadas para humanos. Gratuito. Lido por +48.000 pessoas.">
    <meta property="og:url" content="https://yarivi.com/">
    <meta property="og:image" content="https://yarivi.com/og-cover.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="pt_BR">

    <!-- ═══ Twitter / X Card ═══ -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@yarivi_tech">
    <meta name="twitter:title" content="Yarivi — Tecnologia sem ruído">
    <meta name="twitter:description" content="As principais notícias de tech em português, sem jargão. Grátis, 3× por semana.">
    <meta name="twitter:image" content="https://yarivi.com/og-cover.jpg">

    <!-- ═══ GEO: Schema Markup — NewsMediaOrganization ═══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "name": "Yarivi",
      "alternateName": "Signal Tech",
      "description": "Veículo de jornalismo tecnológico em português brasileiro. Notícias e análises de IA, hardware, cibersegurança, software e mobile — explicadas sem jargão para quem quer entender o mundo digital.",
      "url": "https://yarivi.com",
      "foundingDate": "2024",
      "inLanguage": "pt-BR",
      "audience": {
        "@type": "Audience",
        "audienceType": "Profissionais, estudantes e entusiastas de tecnologia no Brasil"
      },
      "publishingPrinciples": "https://yarivi.com/editorial",
      "sameAs": [
        "https://twitter.com/signal_tech",
        "https://instagram.com/signal.tech",
        "https://linkedin.com/company/signal-tech",
        "https://youtube.com/@yarivi_tech"
      ]
    }
    </script>

    <!-- ═══ GEO: Schema Markup — WebSite com SearchAction ═══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Yarivi",
      "url": "https://yarivi.com",
      "description": "Notícias de tecnologia em português sem jargão",
      "inLanguage": "pt-BR",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://yarivi.com/busca?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ═══ GEO: Schema Markup — FAQPage ═══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O Signal é gratuito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim, o Signal é 100% gratuito. Tanto o site quanto a newsletter semanal não têm custo algum. Você pode se inscrever e cancelar quando quiser, sem compromisso."
          }
        },
        {
          "@type": "Question",
          "name": "Com que frequência a newsletter é enviada?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A newsletter Signal é enviada 3 vezes por semana, sempre com as notícias mais relevantes de tecnologia selecionadas e explicadas em linguagem acessível."
          }
        },
        {
          "@type": "Question",
          "name": "O que diferencia o Signal de outros portais de tecnologia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Signal foi criado para quem quer entender tecnologia sem precisar de um dicionário. Não usamos jargão desnecessário, não publicamos clickbait e filtramos o ruído para entregar só o que realmente importa — cobrindo IA, hardware, cibersegurança, software e mobile."
          }
        },
        {
          "@type": "Question",
          "name": "Como me inscrever na newsletter do Signal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Para assinar a newsletter, basta acessar yarivi.com e inserir seu e-mail no formulário de inscrição. Você começará a receber as edições na semana seguinte. Sem spam — cancele quando quiser."
          }
        },
        {
          "@type": "Question",
          "name": "O Signal cobre quais categorias de tecnologia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Signal cobre 6 categorias principais: IA & Machine Learning (48 artigos), Hardware (35 artigos), Cibersegurança (29 artigos), Software (61 artigos), Mobile (42 artigos) e Futuro da Tech (23 artigos). Todos os conteúdos são em português brasileiro."
          }
        },
        {
          "@type": "Question",
          "name": "Posso escrever para o Signal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim! O Signal aceita colaborações. Para enviar uma pauta ou proposta de artigo, acesse a seção 'Escreva para nós' no rodapé do site."
          }
        }
      ]
    }
    </script>

    <script>
        const t = localStorage.getItem('yarivi-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
